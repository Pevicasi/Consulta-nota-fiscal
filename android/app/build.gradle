plugins { id 'com.android.application' }
android {
    namespace 'br.com.pevicasi.nfefacil'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.pevicasi.nfefacil'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/siteAssets'))
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
tasks.register('syncSite', Sync) {
    from(rootProject.projectDir.parentFile) { include 'index.html', 'consulta_precos_v15.html', 'consulta_precos_v16.html', 'consulta_precos_v17.html' }
    into layout.buildDirectory.dir('generated/siteAssets/site')
}
tasks.named('preBuild').configure { dependsOn 'syncSite' }
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
