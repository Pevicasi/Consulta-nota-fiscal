plugins { id 'com.android.application' }
android {
    namespace 'br.com.pevicasi.nfefacil'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.pevicasi.nfefacil'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    def signingNames = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
    if (signingNames.every { System.getenv(it) }) {
        signingConfigs {
            distribution {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    defaultConfig { resValue 'string', 'app_name', 'NF-e Fácil' }
    buildTypes {
        debug {
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            resValue 'string', 'app_name', 'NF-e Fácil (teste)'
        }
        release {
            debuggable false
            signingConfig signingConfigs.findByName('distribution')
        }
    }
    testBuildType project.hasProperty('distributionInstrumentation') ? 'release' : 'debug'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/siteAssets'))
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
tasks.register('syncSite', Sync) {
    from(rootProject.projectDir.parentFile) { include 'index.html', 'consulta_precos_v15.html', 'consulta_precos_v16.html', 'consulta_precos_v17.html' }
    into layout.buildDirectory.dir('generated/siteAssets/site')
}
tasks.named('preBuild').configure { dependsOn 'syncSite' }
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.google.zxing:core:3.5.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Distribution must fail closed; unsigned or debug-signed fallback APKs are never released.
tasks.register('requireDistributionSigning') {
    doLast {
        if (!['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD', 'ANDROID_SIGNING_CERT_SHA256'].every { System.getenv(it) })
            throw new GradleException('Distribution signing is not provisioned. See android/ASSINATURA.md; no fallback key is generated.')
        def certificate = new ByteArrayOutputStream()
        def result = project.exec {
            commandLine new File(System.getProperty('java.home'), 'bin/keytool'), '-exportcert', '-keystore', System.getenv('ANDROID_KEYSTORE_PATH'), '-alias', System.getenv('ANDROID_KEY_ALIAS'), '-storepass:env', 'ANDROID_KEYSTORE_PASSWORD'
            standardOutput certificate
            errorOutput new ByteArrayOutputStream()
            ignoreExitValue true
        }
        def expected = System.getenv('ANDROID_SIGNING_CERT_SHA256').replace(':', '').toLowerCase(java.util.Locale.ROOT)
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.toByteArray()).encodeHex().toString()
        if (result.exitValue != 0 || !(expected ==~ /[0-9a-f]{64}/) || actual != expected)
            throw new GradleException('Distribution signing certificate does not match the approved SHA-256 fingerprint.')
    }
}
tasks.configureEach { if (name == 'preReleaseBuild') dependsOn 'requireDistributionSigning' }
