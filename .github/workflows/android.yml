name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Build a permanent-key distribution APK (requires signing Secrets and approved certificate)'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Site regression tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm ci && npm test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing policy tests (isolated fixtures only)
        run: python3 -m unittest discover -s android/tools -p 'test_*.py'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build installable APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Report completed unit tests
        run: python3 android/tools/report-tests.py android/app/build/reports/tests/testDebugUnitTest/index.html 8 'Unit'
      - name: Verify personal APK identity, signature, site and checksum
        env:
          EXPECTED_VERSION_CODE: '5'
          EXPECTED_ABI: universal
        run: python3 android/tools/verify-qa.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record raw APK size and ABI breakdown
        run: |
          stat -c %s android/app/build/outputs/apk/debug/app-debug.apk
          python3 android/tools/apk-size.py android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/APK-SIZE.json
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfe-facil-1.2.1-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS
            android/app/build/outputs/apk/debug/SIGNING-CERT-SHA256.txt
            android/app/build/outputs/apk/debug/PERSONAL-DEBUG-SIGNING.txt
            android/app/build/outputs/apk/debug/APK-SIZE.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          path: |
            android/app/build/reports/
            test-results/
          if-no-files-found: warn
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: android
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            bash tools/run-device-tests.sh
      - name: Report completed instrumented tests
        if: always()
        run: python3 android/tools/report-tests.py android/app/build/reports/androidTests/connected/debug/index.html 27 'Instrumented'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/reports/appearance-screenshots/

  distribution:
    if: github.event_name == 'workflow_dispatch' && inputs.distribution && github.ref == 'refs/heads/main'
    needs: [build, device-tests]
    environment: android-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Load approved persistent signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 android/tools/prepare-signing.py
      - name: Build distribution and instrumented tests
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: ./gradlew --no-daemon -PdistributionInstrumentation testReleaseUnitTest lintRelease assembleRelease assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the signed release and package replacement
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: android
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew --no-daemon -PdistributionInstrumentation connectedReleaseAndroidTest
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
      - name: Report completed release tests
        if: always()
        run: |
          python3 android/tools/report-tests.py android/app/build/reports/tests/testReleaseUnitTest/index.html 8 'Release unit'
          python3 android/tools/report-tests.py android/app/build/reports/androidTests/connected/release/index.html 27 'Release instrumented'
      - name: Verify distribution identity, signature and checksum
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          EXPECTED_VERSION_CODE: '5'
        run: python3 android/tools/verify-distribution.py android/app/build/outputs/apk/release/app-release.apk
      - name: Upload approved distribution APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfe-facil-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS
            android/app/build/outputs/apk/release/SIGNING-CERT-SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload release validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-reports
          path: android/app/build/reports/
      - name: Remove temporary private key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/nfe-signing"

  publish-personal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preserve previous APK and publish verified personal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/current delivery/previous delivery/archive
          gh run download "$GITHUB_RUN_ID" --name "nfe-facil-1.2.1-$GITHUB_SHA" --dir delivery/current
          (cd delivery/current && sha256sum -c SHA256SUMS)
          cp delivery/current/app-debug.apk delivery/NF-e-Facil-1.2.1.apk
          (cd delivery && sha256sum NF-e-Facil-1.2.1.apk > SHA256SUMS)
          archived=$(gh release view v1.1.0 --json assets --jq '[.assets[].name] | contains(["NF-e-Facil-1.1.0.apk", "SHA256SUMS"])' 2>/dev/null || true)
          if [ "$archived" != true ]; then
            gh run download 40442578145 --name nfe-facil-1.1.0-5b73ae1bcb005ac06f22496f054c26d66dee5a40 --dir delivery/previous
            (cd delivery/previous && sha256sum -c SHA256SUMS)
            echo '550976a868f36d147165954447d39507cfe17b03957d0a9c04f03a9a4721c35e  delivery/previous/app-debug.apk' | sha256sum -c -
            cp delivery/previous/app-debug.apk delivery/archive/NF-e-Facil-1.1.0.apk
            (cd delivery/archive && sha256sum NF-e-Facil-1.1.0.apk > SHA256SUMS)
            cat > delivery/archive/NOTES.md <<'NOTES'
          APK histórico 1.1.0 (código 3), preservado sem reconstrução a pedido do proprietário. Não contém as melhorias de aparência da versão 1.2.0 e não é a entrega atual.

          Origem: commit 5b73ae1bcb005ac06f22496f054c26d66dee5a40, Actions 40442578145, artefato 12706986411. SHA-256 conferido contra o arquivo original. Este arquivo de versão mantém o APK disponível além da validade do artefato do Actions. Não excluir antes da aprovação do proprietário.
          NOTES
            if gh release view v1.1.0 >/dev/null 2>&1; then
              gh release upload v1.1.0 delivery/archive/NF-e-Facil-1.1.0.apk delivery/archive/SHA256SUMS
            else
            gh release create v1.1.0 delivery/archive/NF-e-Facil-1.1.0.apk delivery/archive/SHA256SUMS --target 5b73ae1bcb005ac06f22496f054c26d66dee5a40 --title 'NF-e Fácil 1.1.0 — APK anterior preservado' --notes-file delivery/archive/NOTES.md --latest=false
            fi
          fi
          cat > delivery/NOTES.md <<NOTES
          NF-e Fácil 1.2.1 (código 5), pacote original br.com.pevicasi.nfefacil, APK universal com assinatura debug automática para uso pessoal. Sem Secrets de assinatura e sem otimização/remoção de ABI.

          Corrigidos importação múltipla SAF com leitura nativa restrita aos documentos selecionados, botão Abrir site em todos os temas e cabeçalhos Quantidade/Produto/Item sem quebra interna. Importação mantém notas anteriores, relata inválidos/vazios e evita duplicar seleções repetidas. Fontes, temas, desconto verde, CSV, impressão, scanner e site público preservados.

          Build, lint (zero erros), 15 testes web, 8 unitários Java, 5 de assinatura e 27 instrumentados Android passaram antes desta publicação. Relatórios e capturas: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Código: $GITHUB_SHA . Auditoria: https://github.com/$GITHUB_REPOSITORY/issues/1 . Checksum do APK no arquivo SHA256SUMS.

          APKs anteriores preservados nas releases v1.1.0 e v1.2.0; nenhum artefato anterior excluído. Assinatura debug pode variar entre runners e impedir atualização entre certificados diferentes; não há desinstalação ou limpeza automática. Não testado no telefone físico do proprietário, impressão física, APIs governamentais reais ou Play Protect.
          NOTES
          if gh release view v1.2.1 >/dev/null 2>&1; then
            published=$(gh release view v1.2.1 --json targetCommitish --jq .targetCommitish)
            if [ "$published" != "$GITHUB_SHA" ]; then
              git fetch --no-tags --depth=1 origin "$published"
              # A delivery-only repair must preserve the already published APK.
              # Any app/build/test change still requires a new version.
              git diff --exit-code "$published" "$GITHUB_SHA" -- . ':!.github/workflows/android.yml' ':!docs/APARENCIA.md' ':!docs/VALIDACAO.md' || { echo 'Existing release preserved: bump version before publishing changed app code.'; exit 1; }
              echo '::notice::Application source unchanged; existing published APK preserved.'
            fi
          else
            gh release create v1.2.1 delivery/NF-e-Facil-1.2.1.apk delivery/SHA256SUMS delivery/current/SIGNING-CERT-SHA256.txt delivery/current/PERSONAL-DEBUG-SIGNING.txt delivery/current/APK-SIZE.json --target "$GITHUB_SHA" --title 'NF-e Fácil 1.2.1 — XMLs múltiplos e legibilidade' --notes-file delivery/NOTES.md --latest
          fi
