<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de Preços</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#202124}
header{background:#1769aa;color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:700}
.wrap{max-width:760px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:13px;border:0;border-radius:10px;background:#ddd;font-weight:700;font-size:16px}
.tab.on{background:#1769aa;color:#fff}.card{background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,select,button{width:100%;padding:12px;border:1px solid #ccd1d6;border-radius:9px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.row{grid-template-columns:1fr}}.go{margin-top:14px;background:#1769aa;color:#fff;border:0;font-weight:700}
.loc{margin-top:8px;background:#eef5fb;color:#1769aa;border:1px solid #b9d5eb}.status{margin-top:14px;padding:10px;border-radius:8px;background:#f2f2f2;white-space:pre-wrap;overflow-wrap:anywhere}
.result{margin-top:12px}.item{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}
.price{font-size:22px;font-weight:700;color:#16733b}.small{font-size:12px;color:#666}.hide{display:none}
</style>
</head>
<body>
<header>Consulta de Preços<div class="small" style="color:#fff;font-weight:400;margin-top:4px">Compare preços próximos de você</div></header>
<div class="wrap">
 <div class="tabs"><button id="t1" class="tab on" onclick="setTab(1)">Consulta 1</button><button id="t2" class="tab" onclick="setTab(2)">Consulta 2</button></div>
 <div class="card">
  <label>Produto ou código de barras</label><input id="q" placeholder="Ex.: arroz ou 789...">
  <label>Local da pesquisa</label>
  <div style="position:relative">
    <input id="cidadeBusca" autocomplete="off" placeholder="Digite uma cidade para alterar o local">
    <div id="sugestoes" class="hide" style="position:absolute;z-index:10;left:0;right:0;background:white;border:1px solid #ccd1d6;border-radius:9px;max-height:230px;overflow:auto;box-shadow:0 4px 12px #0002"></div>
  </div>
  <button class="loc" onclick="loc()">📍 Voltar para minha localização</button>
  <div id="localNome" class="status">Obtendo sua localização...</div>
  <input id="lat" type="hidden"><input id="lon" type="hidden">
  <div class="row"><div><label>Raio</label><select id="raio"><option>5</option><option>10</option><option selected>20</option><option>30</option></select></div><div><label>Período (dias)</label><select id="dias"><option value="1">1 dia</option><option value="3">3 dias</option><option value="7">7 dias</option><option value="15" selected>15 dias</option></select></div></div>
  <div id="tokenBox" class="hide"><label>Token da Consulta 2</label><input id="token" placeholder="Bearer token do Menor Preço Brasil"></div>
  <button class="go" onclick="consultar()">Pesquisar</button>
  <div id="status" class="status">Pronto para testar.</div><div id="result" class="result"></div>
 </div>
</div>
<script>
let tab=1;
function setTab(n){tab=n;t1.classList.toggle('on',n===1);t2.classList.toggle('on',n===2);tokenBox.classList.toggle('hide',n!==2);status.textContent=n===1?'Consulta 1: Menor Preço (Celepar)':'Consulta 2: Menor Preço Brasil (PROCERGS)';result.innerHTML=''}
async function nomearLocal(la,lo){try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}&zoom=10&addressdetails=1`,{headers:{'Accept-Language':'pt-BR'}});let d=await r.json(),a=d.address||{};localNome.textContent=(a.city||a.town||a.municipality||a.village||'Local atual')+(a.state?' - '+a.state:'')}catch{localNome.textContent='Localização atual'}}
function loc(){status.textContent='Obtendo localização...';navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lon.value=p.coords.longitude;nomearLocal(lat.value,lon.value);status.textContent='Localização definida.'},e=>status.textContent='Erro de localização: '+e.message,{enableHighAccuracy:true})}
let timerCidade;
cidadeBusca.addEventListener('input',()=>{
 clearTimeout(timerCidade);
 let q=cidadeBusca.value.trim();
 if(q.length<2){sugestoes.classList.add('hide');return}
 timerCidade=setTimeout(()=>buscarCidades(q),300);
});
async function buscarCidades(q){
 try{
  let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&addressdetails=1&limit=10&dedupe=1&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pt-BR'}});
  let d=await r.json();
  d=d.filter(x=>{let a=x.address||{};return a.city||a.town||a.municipality||a.village||a.city_district||a.county});
  sugestoes.innerHTML=d.map((x,i)=>{let a=x.address||{},c=a.city||a.town||a.municipality||a.village||a.city_district||a.county||x.name,uf=a['ISO3166-2-lvl4']?a['ISO3166-2-lvl4'].replace('BR-',''):a.state||'';return `<div onclick="selecionarCidade(${i})" style="padding:12px;border-bottom:1px solid #eee;cursor:pointer"><b>${esc(c)}</b>${uf?' - '+esc(uf):''}<div class="small">${esc(a.state||'')}</div></div>`}).join('');
  window._cidades=d;
  sugestoes.classList.toggle('hide',!d.length);
 }catch{}
}
function selecionarCidade(i){
 let x=window._cidades[i],a=x.address||{},c=a.city||a.town||a.municipality||a.village||a.city_district||a.county||x.name,uf=a['ISO3166-2-lvl4']?a['ISO3166-2-lvl4'].replace('BR-',''):a.state||'';
 lat.value=x.lat;lon.value=x.lon;localNome.textContent=c+(uf?' - '+uf:'');cidadeBusca.value='';sugestoes.classList.add('hide');status.textContent='Local alterado para '+localNome.textContent+'.';
}
document.addEventListener('click',e=>{if(!cidadeBusca.contains(e.target)&&!sugestoes.contains(e.target))sugestoes.classList.add('hide')});
function geohash(latitude,longitude,precision=12){const base32='0123456789bcdefghjkmnpqrstuvwxyz';let idx=0,bit=0,even=true,hash='',latR=[-90,90],lonR=[-180,180];while(hash.length<precision){let r=even?lonR:latR,v=even?longitude:latitude,mid=(r[0]+r[1])/2;if(v>=mid){idx=idx*2+1;r[0]=mid}else{idx=idx*2;r[1]=mid}even=!even;if(++bit===5){hash+=base32[idx];bit=0;idx=0}}return hash}
function pick(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return ''}
function parseDate(v){if(!v)return null;if(typeof v==='number')return new Date(v<1e12?v*1000:v);let d=new Date(v);return isNaN(d)?null:d}
function relativo(v){let d=parseDate(v);if(!d)return '';let m=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(m<1)return 'agora';if(m<60)return 'há '+m+' minuto'+(m>1?'s':'');let h=Math.floor(m/60);if(h<24)return 'há '+h+' hora'+(h>1?'s':'');let dias=Math.floor(h/24);return 'há '+dias+' dia'+(dias>1?'s':'')}
function show(data){
 let a=Array.isArray(data)?data:(data.produtos||data.itens||data.items||data.resultado||data.results||[]);
 if(!Array.isArray(a)){result.innerHTML='<div class="item"><pre>'+esc(JSON.stringify(data,null,2))+'</pre></div>';return}
 // Keep only newest record for each establishment + product/code.
 let map=new Map();
 for(const x of a){
   let e=(x.estabelecimento&&typeof x.estabelecimento==='object')?x.estabelecimento:(x.empresa&&typeof x.empresa==='object'?x.empresa:{});
   let loja=pick(e,['nm_fan','nm_emp','nomeFant','nomeContrib','nome','razaoSocial'])||pick(x,['nomeEstabelecimento','nm_fan','nm_emp']);
   let cod=pick(x,['gtin','codigoBarras','codBarras','codigo','cd_produto','idProduto']);
   let nome=pick(x,['descricao','nome','descItem','dscProduto','nm_prod','ds_produto','descricaoProduto','produtoDescricao']);
   if(x.produto&&typeof x.produto==='object') nome=nome||pick(x.produto,['descricao','nome','dscProduto','nm_prod']);
   let dt=pick(x,['dataHora','dhEmi','dataVenda','dtVenda','data','dthr','dataEmissao','dt_emissao','created_at']);
   let key=(pick(e,['cnpj','nr_cnpj','codigo'])||loja)+'|'+(cod||nome);
   let old=map.get(key);
   if(!old || ((parseDate(dt)?.getTime()||0)>(parseDate(old.dt)?.getTime()||0))) map.set(key,{x,e,loja,cod,nome,dt});
 }
 let rows=[...map.values()].sort((A,B)=>{
   let pa=Number(pick(A.x,['valor','preco','vlrItem','valorUnitario','vlr_unitario'])||999999);
   let pb=Number(pick(B.x,['valor','preco','vlrItem','valorUnitario','vlr_unitario'])||999999);
   return pa-pb;
 });
 result.innerHTML=rows.length?rows.slice(0,50).map(r=>{
   let {x,e,loja,nome,dt}=r;
   let p=pick(x,['valor','preco','vlrItem','valorUnitario','vlr_unitario']);
   let endereco=[pick(e,['tp_logr','tipoLogradouro']),pick(e,['nm_logr','logradouro']),pick(e,['nr_logr','numero'])].filter(Boolean).join(' ');
   let bairro=pick(e,['bairro','nm_bairro']), mun=pick(e,['mun','municipio','cidade']);
   return `<div class="item"><b>${esc(nome||'Produto')}</b><div class="price">${p!==''?'R$ '+Number(p).toLocaleString('pt-BR',{minimumFractionDigits:2}):''}</div>${loja?`<div><b>${esc(loja)}</b></div>`:''}${endereco?`<div>${esc(endereco)}</div>`:''}${bairro||mun?`<div class="small">${esc([bairro,mun].filter(Boolean).join(' • '))}</div>`:''}${dt?`<div class="small" style="margin-top:6px">🕒 ${esc(relativo(dt))}</div>`:''}</div>`
 }).join(''):'<div class="item">Nenhum resultado encontrado.</div>'
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function consultar(){result.innerHTML='';let query=q.value.trim(),la=parseFloat(lat.value),lo=parseFloat(lon.value);if(!query||!Number.isFinite(la)||!Number.isFinite(lo)){status.textContent='Informe produto e localização.';return}
 let url,opt={headers:{'Accept':'application/json'}};
 if(tab===1){let params=new URLSearchParams({local:geohash(la,lo),raio:raio.value,data:dias.value,ordem:'0'});if(/^\d{8,14}$/.test(query))params.set('gtin',query);else params.set('termo',query);url='https://menorpreco.notaparana.pr.gov.br/api/v1/produtos?'+params}
 else{let tok=token.value.trim();if(!tok){status.textContent='A Consulta 2 exige autenticação. Cole o token para testar.';return}let params=new URLSearchParams({'pesquisa.latitude':la,'pesquisa.longitude':lo,'pesquisa.nroKmDistancia':raio.value,'pesquisa.nroDiaPrz':dias.value});let endpoint;if(/^\d{8,14}$/.test(query)){endpoint='PorGtin';params.set('pesquisa.gtin',query)}else{endpoint='PorDescricao';params.set('pesquisa.descricao',query)}url='https://mprs.sefaz.rs.gov.br/API/ConsultaMenorPrecoBrasil/api/v1/Item/'+endpoint+'?'+params;opt.headers.Authorization=tok.toLowerCase().startsWith('bearer ')?tok:'Bearer '+tok}
 status.textContent='Consultando...';
 try{let r=await fetch(url,opt);let text=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' — '+text.slice(0,300));let data;try{data=JSON.parse(text)}catch{data=text}status.textContent='Consulta concluída.';show(data)}
 catch(e){status.textContent='Falhou: '+e.message+'\n\nSe aparecer CORS/bloqueio do navegador, a próxima versão será HTML + PHP.'}
}
window.addEventListener('load',()=>{if(navigator.geolocation)loc();else localNome.textContent='Digite uma cidade para pesquisar.'});
</script>
</body></html>
